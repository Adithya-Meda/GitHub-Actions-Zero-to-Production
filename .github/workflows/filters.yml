name: Paths and Paths-Ignore Filters

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
 check-path:
   runs-on: ubuntu-latest
   steps:
    - name: Display text
      run: echo ".md file updates are ignored"
