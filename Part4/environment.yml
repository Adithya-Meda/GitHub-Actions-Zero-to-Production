name: Deploy with Environment

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up JDK
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Build Workspace
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: maven-build-workspace
          path: .

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download Build Workspace
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: maven-build-workspace

      - name: Run Unit Tests
        run: mvn test

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [build, test]
    environment: staging
    steps:
      - name: Show Staging Status
        run: echo "Running deployment tasks for the STAGING environment."

  deploy-production:
    needs: [build, test, deploy-staging]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Show Production Status
        run: echo "Running deployment tasks for the PRODUCTION environment."
