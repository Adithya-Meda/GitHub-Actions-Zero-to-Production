name: PR Comment using GH Actions

on:
  pull_request:
   branches: main

jobs:
  pr-comment-job:
    name: Comment on the pull request
    runs-on: windows-latest
    permissions:
     contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.ref }}
    - name: Post a comment
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Lint and tests passed."
