name: Passing Data across jobs with $GITHUB_OUTPUT

on:
 workflow_dispatch:

jobs:
  job-one:
    runs-on: ubuntu-latest
    outputs:
      name: ${{ steps.one.outputs.name }}
    steps:
      - id: one
        run: echo "name=AdithyaMeda" >> "$GITHUB_OUTPUT"

  job-two:
    needs: job-one
    runs-on: ubuntu-latest
    steps:
      - run: echo "Hello ${{ needs.job-one.outputs.name }}"
